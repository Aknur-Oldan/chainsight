<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RVCS — Coordinator Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --dim:#8b949e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; height:100vh; }
  header { padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
  header h1 { font-size:16px; margin:0; }
  .badge { font-size:11px; padding:2px 8px; border-radius:10px; background:#1f6feb33; color:#58a6ff; border:1px solid #1f6feb; }
  .badge.red { background:#da363333; color:#ff7b72; border-color:#da3633; }
  header .links { margin-left:auto; font-size:13px; }
  header a { color:#58a6ff; margin-left:12px; text-decoration:none; }
  main { flex:1; display:grid; grid-template-columns: 340px 1fr 300px; overflow:hidden; }
  #map { height:100%; }
  .panel { background:var(--panel); border-right:1px solid var(--border); overflow-y:auto; padding:12px; }
  .panel.right { border-right:none; border-left:1px solid var(--border); }
  h2 { font-size:12px; text-transform:uppercase; color:var(--dim); margin:10px 0 6px; }
  .vol { padding:8px; border:1px solid var(--border); border-radius:6px; margin-bottom:6px; font-size:13px; display:flex; justify-content:space-between; align-items:center; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:6px; }
  .st-AVAILABLE { background:#58a6ff; } .st-PENDING { background:#d29922; }
  .st-DISPATCHED { background:#3fb950; } .st-DECLINED { background:#f85149; }
  .status { font-size:11px; color:var(--dim); }
  select, input, button { background:#0d1117; color:var(--text); border:1px solid var(--border); border-radius:6px; padding:7px; font-size:13px; width:100%; margin-bottom:6px; }
  button { background:#da3633; border:none; font-weight:600; cursor:pointer; }
  button:hover { background:#f85149; }
  button.sec { background:#21262d; }
  .event { font-size:12px; padding:5px 0; border-bottom:1px solid var(--border); color:var(--dim); }
  .event b { color:var(--text); }
</style>
</head>
<body>
<header>
  <h1>🛰️ RVCS Coordinator</h1>
  <span class="badge">SSOT: LIVE</span>
  <span class="badge red">IP NETWORKS: DOWN — GSM/USSD FALLBACK ACTIVE</span>
  <div class="links">
    <a href="/onboard" target="_blank">Onboarding (BankID)</a>
    <a href="/phone" target="_blank">Volunteer Phone (USSD)</a>
  </div>
</header>
<main>
  <div class="panel">
    <h2>Dispatch Request</h2>
    <select id="skill">
      <option value="medic">Medic</option>
      <option value="engineer">Engineer</option>
      <option value="driver_4x4">4x4 Driver</option>
      <option value="drone_operator">Drone Operator</option>
    </select>
    <select id="sector">
      <option value="A">Sector A — Main Square</option>
      <option value="B">Sector B — West</option>
      <option value="C">Sector C — North-East</option>
    </select>
    <input id="count" type="number" value="2" min="1" max="10">
    <input id="msg" value="URGENT: Medic needed at Main Square.">
    <button onclick="dispatchReq()">🚨 DISPATCH via USSD</button>
    <button class="sec" onclick="fetch('/api/reset',{method:'POST'}).then(refresh)">Reset demo</button>
    <h2>Volunteers (SSOT)</h2>
    <div id="vols"></div>
  </div>
  <div id="map"></div>
  <div class="panel right">
    <h2>Signal Log</h2>
    <div id="events"></div>
  </div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([50.0647, 19.9450], 14);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  { attribution:'&copy; OSM &copy; CARTO' }).addTo(map);

const COLORS = { AVAILABLE:'#58a6ff', PENDING:'#d29922', DISPATCHED:'#3fb950', DECLINED:'#f85149' };
let markers = {};

async function refresh() {
  const s = await (await fetch('/api/state')).json();
  document.getElementById('vols').innerHTML = s.volunteers.map(v => `
    <div class="vol">
      <span><span class="dot st-${v.status}"></span>${v.name}<br>
        <span class="status">${v.skill} · Sector ${v.sector} · ✅ BankID</span></span>
      <span class="status">${v.status}</span>
    </div>`).join('');
  document.getElementById('events').innerHTML = s.events.map(e =>
    `<div class="event"><b>${e.t}</b> ${e.msg}</div>`).join('');
  for (const v of s.volunteers) {
    if (markers[v.id]) { markers[v.id].setStyle({ color:COLORS[v.status], fillColor:COLORS[v.status] }); }
    else {
      markers[v.id] = L.circleMarker([v.lat, v.lng], {
        radius:9, color:COLORS[v.status], fillColor:COLORS[v.status], fillOpacity:0.85
      }).addTo(map).bindPopup(`<b>${v.name}</b><br>${v.skill} · Sector ${v.sector}`);
    }
    markers[v.id].bindPopup(`<b>${v.name}</b><br>${v.skill} · ${v.status}`);
  }
}

async function dispatchReq() {
  const body = {
    skill: document.getElementById('skill').value,
    sector: document.getElementById('sector').value,
    count: +document.getElementById('count').value,
    message: document.getElementById('msg').value,
  };
  const r = await fetch('/api/dispatch', { method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if (!r.ok) alert((await r.json()).detail);
  refresh();
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
