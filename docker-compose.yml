services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chainsight
      POSTGRES_PASSWORD: chainsight
      POSTGRES_DB: chainsight
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainsight"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "5432:5432"

  vault:
    build: ./services/vault
    environment:
      DATABASE_URL: postgresql://chainsight:chainsight@db:5432/chainsight
      # DEMO ONLY — in production keys live in an HSM/KMS, never in compose files
      FERNET_KEY: "Zx8RrB3LtJ0wXkQy6vNfA2mPdC4sE7uHgT1iO5lYq9U="
      HMAC_KEY: "demo-hmac-key-change-me"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"

  audit:
    build: ./services/audit
    environment:
      DATABASE_URL: postgresql://chainsight:chainsight@db:5432/chainsight
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8002:8000"

  urzad:
    build: ./services/urzad
    environment:
      # DEMO ONLY — shared packet-signing key; in production use mTLS + asymmetric signatures
      SIGNING_KEY: "demo-signing-key-change-me"
      MAX_CLOCK_SKEW_SECONDS: "60"
    ports:
      - "8003:8000"

  gateway:
    build: ./services/gateway
    environment:
      VAULT_URL: http://vault:8000
      AUDIT_URL: http://audit:8000
      URZAD_URL: http://urzad:8000
      URZAD_API_KEY: "urzad-key-123"
      SIGNING_KEY: "demo-signing-key-change-me"
      MAX_DETOKENIZE_PER_MINUTE: "5"
    depends_on:
      - vault
      - audit
      - urzad
    ports:
      - "8000:8000"
